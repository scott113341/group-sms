name: Test

on:
  push:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Lint
        run: npm run lint
